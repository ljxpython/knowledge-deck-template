<p class="eyebrow">03 / Process</p><h1 class="section-title">Use a deliberate sequence.</h1><div class="steps"><article class="step"><strong>Frame</strong><span>Name the decision and its constraint.</span></article><article class="step"><strong>Gather</strong><span>Collect only evidence that can change it.</span></article><article class="step"><strong>Choose</strong><span>Prefer the least irreversible option that works.</span></article><article class="step"><strong>Record</strong><span>Write down what would trigger review.</span></article></div>
